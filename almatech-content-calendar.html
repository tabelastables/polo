<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlmaTech – Content Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1D56CF;--blue-d:#1644AA;--blue-l:#4A8FFF;
  --gold:#D5AD36;--gold-l:#F0CB58;
  --green:#16a34a;--green-l:#4ADE80;
  --bg:#F5F0E8;--bg2:#EEF3FF;--surface:#fff;
  --text1:#111827;--text2:#374151;--text3:#6B7280;
  --border:rgba(29,86,207,0.12);--border2:rgba(29,86,207,0.08);
  --shadow:rgba(29,86,207,0.08);
  --r:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Montserrat',sans-serif;
  background:linear-gradient(160deg,#F5F0E8 0%,#EEF3FF 100%);
  color:var(--text1);min-height:100vh;
}

/* ── HEADER ── */
header{
  padding:24px 40px;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
  border-bottom:1.5px solid var(--border);
  background:rgba(255,255,255,0.82);
  backdrop-filter:blur(40px) saturate(180%);
  position:sticky;top:0;z-index:100;
  box-shadow:0 2px 20px var(--shadow);
}
.logo-row{display:flex;align-items:center;gap:14px}
.logo-box{
  width:44px;height:44px;border-radius:13px;
  background:linear-gradient(135deg,#1D56CF,#1644AA);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(29,86,207,0.35);flex-shrink:0;
}
.logo-box svg{width:26px;height:26px}
.brand-name{font-size:21px;font-weight:900;letter-spacing:-0.03em;color:var(--text1)}
.brand-name span{color:var(--blue)}
.brand-sub{font-size:9px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--text3)}
.header-right{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.progress-wrap{text-align:right}
.progress-label{font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.progress-bar-outer{width:180px;height:7px;background:rgba(29,86,207,0.1);border-radius:4px;overflow:hidden;border:1px solid var(--border)}
.progress-bar-inner{height:100%;background:linear-gradient(90deg,#1D56CF,#D5AD36);border-radius:4px;transition:width 0.4s ease}
.progress-count{font-size:11px;font-weight:800;color:var(--blue);margin-top:5px;text-align:right}

/* ── FILTERS ── */
.filters{
  padding:16px 40px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  border-bottom:1.5px solid var(--border);
  background:rgba(255,255,255,0.6);
}
.filter-label{font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text3);margin-right:4px}
.filter-btn{
  padding:7px 16px;border-radius:100px;font-size:11px;font-weight:700;
  font-family:'Montserrat',sans-serif;cursor:pointer;
  border:1.5px solid var(--border);background:transparent;color:var(--text3);
  transition:all 0.2s;letter-spacing:0.03em;
}
.filter-btn:hover{border-color:rgba(29,86,207,0.3);color:var(--blue);background:rgba(29,86,207,0.04)}
.filter-btn.active{background:rgba(29,86,207,0.08);border-color:rgba(29,86,207,0.35);color:var(--blue)}

/* ── MAIN ── */
.main{padding:32px 40px;max-width:1400px;margin:0 auto}

/* ── WEEK ── */
.week-section{margin-bottom:44px}
.week-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.week-badge{
  padding:6px 18px;border-radius:100px;
  background:rgba(29,86,207,0.07);border:1.5px solid var(--border);
  font-size:10px;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;
  color:var(--blue);flex-shrink:0;
}
.week-line{flex:1;height:1.5px;background:linear-gradient(90deg,var(--border),transparent)}
.week-stats{font-size:10px;font-weight:700;color:var(--text3);white-space:nowrap}

/* ── POSTS GRID ── */
.posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}

/* ── POST CARD ── */
.post-card{
  border-radius:20px;
  background:var(--surface);
  border:1.5px solid var(--border);
  box-shadow:0 4px 24px var(--shadow),0 1px 4px rgba(0,0,0,0.04),inset 0 1px 0 rgba(255,255,255,0.9);
  overflow:hidden;transition:all 0.25s ease;position:relative;
}
.post-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(29,86,207,0.2),transparent);
}
.post-card:hover{
  transform:translateY(-3px);
  box-shadow:0 16px 48px rgba(29,86,207,0.12),0 4px 12px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.95);
  border-color:rgba(29,86,207,0.25);
}
.post-card.done{
  background:linear-gradient(160deg,#f0fdf4,#fff);
  border-color:rgba(22,163,74,0.25);
}
.post-card.done::before{background:linear-gradient(90deg,transparent,rgba(22,163,74,0.3),transparent)}

/* accent bar */
.card-accent{height:3px;width:100%}
.pillar-explain .card-accent{background:linear-gradient(90deg,#1D56CF,#4A8FFF)}
.pillar-mistake .card-accent{background:linear-gradient(90deg,#D5AD36,#F0CB58)}
.pillar-would   .card-accent{background:linear-gradient(90deg,#16a34a,#4ADE80)}

/* card top */
.card-top{
  padding:18px 20px 14px;border-bottom:1.5px solid var(--border2);
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
}
.card-meta{flex:1}
.card-date-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.day-chip{padding:3px 9px;border-radius:100px;font-size:8px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase}
.day-mon{background:rgba(29,86,207,0.1);color:var(--blue);border:1px solid rgba(29,86,207,0.2)}
.day-wed{background:rgba(213,173,54,0.12);color:#9a7a1a;border:1px solid rgba(213,173,54,0.25)}
.day-fri{background:rgba(22,163,74,0.1);color:#15803d;border:1px solid rgba(22,163,74,0.2)}
.card-date-txt{font-size:10px;font-weight:600;color:var(--text3)}
.card-ep{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:0.1em;margin-bottom:5px}
.card-title{font-size:14px;font-weight:800;color:var(--text1);line-height:1.38;letter-spacing:-0.01em}
.card-series{
  display:inline-block;margin-top:9px;
  font-size:8px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;
  padding:3px 10px;border-radius:100px;
}
.pillar-explain .card-series{background:rgba(29,86,207,0.08);color:var(--blue);border:1px solid rgba(29,86,207,0.18)}
.pillar-mistake .card-series{background:rgba(213,173,54,0.1);color:#9a7a1a;border:1px solid rgba(213,173,54,0.2)}
.pillar-would   .card-series{background:rgba(22,163,74,0.08);color:#15803d;border:1px solid rgba(22,163,74,0.18)}

.card-status{flex-shrink:0;text-align:center}
.status-ring{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--border);font-size:20px;
  background:rgba(29,86,207,0.04);transition:all 0.3s;
}
.post-card.done .status-ring{
  border-color:rgba(22,163,74,0.4);background:rgba(22,163,74,0.07);
  box-shadow:0 0 16px rgba(22,163,74,0.15);
}
.status-text{font-size:8px;font-weight:700;color:var(--text3);margin-top:4px;letter-spacing:0.08em}
.post-card.done .status-text{color:#15803d}

/* ── PLATFORMS ── */
.card-body{padding:16px 20px}
.section-label{font-size:9px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.platforms-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.platform-row{
  display:flex;align-items:center;gap:9px;
  padding:9px 12px;border-radius:10px;
  background:rgba(29,86,207,0.03);border:1.5px solid var(--border2);
  cursor:pointer;transition:all 0.18s;user-select:none;
}
.platform-row:hover{background:rgba(29,86,207,0.06);border-color:rgba(29,86,207,0.2)}
.platform-row.checked{background:rgba(22,163,74,0.06);border-color:rgba(22,163,74,0.28)}
.platform-row.checked .plat-name{color:#15803d;font-weight:800}
.plat-checkbox{
  width:16px;height:16px;border-radius:4px;border:1.5px solid rgba(29,86,207,0.25);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:transparent;transition:all 0.18s;
}
.platform-row.checked .plat-checkbox{background:#16a34a;border-color:#16a34a;box-shadow:0 0 8px rgba(22,163,74,0.3)}
.plat-check-icon{display:none;width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.platform-row.checked .plat-check-icon{display:block}
.plat-icon{font-size:13px;flex-shrink:0}
.plat-name{font-size:10px;font-weight:700;color:var(--text2);flex:1}
.plat-time{font-size:8px;color:var(--text3);font-weight:600;white-space:nowrap}

/* ── CAPTIONS ── */
.captions-wrap{margin-top:4px}
.caption-tabs{display:flex;gap:6px;margin-bottom:10px}
.cap-tab{
  padding:5px 13px;border-radius:100px;font-size:10px;font-weight:700;
  font-family:'Montserrat',sans-serif;cursor:pointer;
  border:1.5px solid var(--border);background:transparent;color:var(--text3);
  transition:all 0.15s;
}
.cap-tab.active{background:rgba(29,86,207,0.08);border-color:rgba(29,86,207,0.3);color:var(--blue)}
.caption-box{
  position:relative;border-radius:12px;
  background:rgba(29,86,207,0.03);border:1.5px solid var(--border2);
  padding:13px 14px;
}
.caption-text{
  font-size:11px;color:var(--text2);line-height:1.75;font-weight:500;
  white-space:pre-wrap;word-break:break-word;
  max-height:130px;overflow-y:auto;
  padding-right:6px;
}
.caption-text::-webkit-scrollbar{width:3px}
.caption-text::-webkit-scrollbar-track{background:transparent}
.caption-text::-webkit-scrollbar-thumb{background:rgba(29,86,207,0.2);border-radius:4px}
.copy-btn{
  position:absolute;top:10px;right:10px;
  padding:5px 12px;border-radius:8px;font-size:9px;font-weight:800;
  font-family:'Montserrat',sans-serif;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;
  border:1.5px solid rgba(29,86,207,0.25);background:rgba(29,86,207,0.07);
  color:var(--blue);transition:all 0.2s;
}
.copy-btn:hover{background:rgba(29,86,207,0.14);border-color:rgba(29,86,207,0.4)}
.copy-btn.copied{background:rgba(22,163,74,0.1);border-color:rgba(22,163,74,0.35);color:#15803d}

/* ── NOTES ── */
.notes-row{margin-top:10px}
.notes-input{
  width:100%;background:rgba(29,86,207,0.02);border:1.5px solid var(--border2);
  border-radius:10px;padding:9px 13px;
  font-family:'Montserrat',sans-serif;font-size:11px;font-weight:500;
  color:var(--text1);outline:none;transition:border-color 0.2s;
}
.notes-input::placeholder{color:var(--text3)}
.notes-input:focus{border-color:rgba(29,86,207,0.35);background:rgba(29,86,207,0.03)}

/* ── LEGEND ── */
.legend{
  padding:18px 40px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;
  border-top:1.5px solid var(--border);background:rgba(255,255,255,0.5);
}
.legend-item{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;color:var(--text3)}
.legend-dot{width:10px;height:10px;border-radius:50%}

/* ── SCROLL TOP ── */
#scrollTop{
  position:fixed;bottom:28px;right:28px;z-index:200;
  width:44px;height:44px;border-radius:50%;
  background:var(--blue);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.2s;
  box-shadow:0 6px 20px rgba(29,86,207,0.4);
  opacity:0;pointer-events:none;
}
#scrollTop.show{opacity:1;pointer-events:auto}
#scrollTop:hover{background:var(--blue-d);transform:translateY(-2px)}
#scrollTop svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

@media(max-width:700px){
  header,.filters,.main,.legend{padding-left:16px;padding-right:16px}
  .posts-grid{grid-template-columns:1fr}
  .progress-bar-outer{width:130px}
}
</style>
</head>

          en:`📦 A Mutual Fund is just a group of people pooling their money.

function load(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function platKey(ep,pid){return 'plt_'+ep.replace(/\s/g,'_')+'_'+pid}
function noteKey(ep){return 'nte_'+ep.replace(/\s/g,'_')}
function capLangKey(ep){return 'clng_'+ep.replace(/\s/g,'_')}
function cardId(ep){return 'card_'+ep.replace(/\s/g,'_')}
function isDone(ep){return PLATFORMS.every(p=>load(platKey(ep,p.id))===true)}

/* ═══════════════════════════════════════════════
   BUILD CARD
═══════════════════════════════════════════════ */
function buildCard(post){
  const done     = isDone(post.ep);
  const note     = load(noteKey(post.ep))||'';
  const capLang  = load(capLangKey(post.ep))||'en';
  const dayCls   = post.day==='MON'?'day-mon':post.day==='WED'?'day-wed':'day-fri';

  const plats = PLATFORMS.map(p=>{
    const chk = load(platKey(post.ep,p.id))===true;
    return `<div class="platform-row${chk?' checked':''}" onclick="togglePlat('${post.ep}','${p.id}',this)">
      <div class="plat-checkbox"><svg class="plat-check-icon" viewBox="0 0 12 12"><polyline points="1.5 6 4.5 9 10.5 3"/></svg></div>
      <span class="plat-icon">${p.icon}</span>
      <span class="plat-name">${p.name}</span>
      <span class="plat-time">${p.time}</span>
    </div>`;
  }).join('');

  const capText = (post.captions[capLang]||'').replace(/`/g,'\\`');

  return `
  <div class="post-card ${post.pillar}${done?' done':''}" id="${cardId(post.ep)}" data-pillar="${post.pillar}" data-done="${done}">
    <div class="card-accent"></div>
    <div class="card-top">
      <div class="card-meta">
        <div class="card-date-row">
          <span class="day-chip ${dayCls}">${post.day}</span>
          <span class="card-date-txt">${post.date}</span>
        </div>
        <div class="card-ep">${post.ep} · AlmaTech Cartoon Series</div>
        <div class="card-title">${post.title}</div>
        <span class="card-series">${post.series}</span>
      </div>
      <div class="card-status">
        <div class="status-ring">${done?'✅':'🎬'}</div>
        <div class="status-text">${done?'DONE':'PENDING'}</div>
      </div>
    </div>
    <div class="card-body">
      <div class="section-label">Post to platforms</div>
      <div class="platforms-grid">${plats}</div>

      <div class="captions-wrap">
        <div class="section-label">Caption — copy &amp; paste</div>
        <div class="caption-tabs">
          <button class="cap-tab${capLang==='en'?' active':''}" onclick="switchLang('${post.ep}','en',this)">🇬🇧 English</button>
          <button class="cap-tab${capLang==='hi'?' active':''}" onclick="switchLang('${post.ep}','hi',this)">🇮🇳 Hindi</button>
        </div>
        <div class="caption-box" id="capbox_${cardId(post.ep)}">
          <div class="caption-text" id="captxt_${cardId(post.ep)}">${(post.captions[capLang]||'').replace(/</g,'&lt;')}</div>
          <button class="copy-btn" id="copybtn_${cardId(post.ep)}" onclick="copyCaption('${post.ep}')">Copy</button>
        </div>
      </div>

      <div class="notes-row">
        <input class="notes-input" type="text" placeholder="📝 Add notes — link, scheduling time, performance..." value="${note.replace(/"/g,'&quot;')}" oninput="saveNote('${post.ep}',this.value)"/>
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════ */
function renderAll(){
  const main = document.getElementById('main');
  let html='';
  WEEKS.forEach(w=>{
    const doneN = w.posts.filter(p=>isDone(p.ep)).length;
    html+=`<div class="week-section">
      <div class="week-header">
        <div class="week-badge">${w.label}</div>
        <div class="week-line"></div>
        <div class="week-stats">${w.dates} · ${doneN}/${w.posts.length} done</div>
      </div>
      <div class="posts-grid">${w.posts.map(buildCard).join('')}</div>
    </div>`;
  });
  main.innerHTML=html;
  updateProgress();
}

/* ═══════════════════════════════════════════════
   INTERACTIONS
═══════════════════════════════════════════════ */
function togglePlat(ep,pid,row){
  const was=load(platKey(ep,pid))===true;
  save(platKey(ep,pid),!was);
  row.classList.toggle('checked',!was);
  const icon=row.querySelector('.plat-check-icon');
  const cb=row.querySelector('.plat-checkbox');
  icon.style.display=!was?'block':'none';
  cb.style.background=!was?'#16a34a':'';
  cb.style.borderColor=!was?'#16a34a':'';
  const done=isDone(ep);
  const card=document.getElementById(cardId(ep));
  if(card){
    card.classList.toggle('done',done);
    card.dataset.done=done;
    card.querySelector('.status-ring').textContent=done?'✅':'🎬';
    card.querySelector('.status-text').textContent=done?'DONE':'PENDING';
  }
  updateProgress();
}

function switchLang(ep,lang,btn){
  save(capLangKey(ep),lang);
  const post=WEEKS.flatMap(w=>w.posts).find(p=>p.ep===ep);
  if(!post) return;
  const cid=cardId(ep);
  document.getElementById('captxt_'+cid).innerHTML=(post.captions[lang]||'').replace(/</g,'&lt;');
  btn.closest('.caption-tabs').querySelectorAll('.cap-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  // reset copy button
  const copyBtn=document.getElementById('copybtn_'+cid);
  if(copyBtn){copyBtn.textContent='Copy';copyBtn.classList.remove('copied')}
}

function copyCaption(ep){
  const lang=load(capLangKey(ep))||'en';
  const post=WEEKS.flatMap(w=>w.posts).find(p=>p.ep===ep);
  if(!post) return;
  navigator.clipboard.writeText(post.captions[lang]||'').then(()=>{
    const btn=document.getElementById('copybtn_'+cardId(ep));
    if(btn){btn.textContent='✅ Copied!';btn.classList.add('copied');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied')},2500)}
  }).catch(()=>{
    const txt=document.getElementById('captxt_'+cardId(ep));
    if(txt){const r=document.createRange();r.selectNode(txt);window.getSelection().removeAllRanges();window.getSelection().addRange(r)}
  });
}

function saveNote(ep,val){save(noteKey(ep),val)}

function updateProgress(){
  const all=WEEKS.flatMap(w=>w.posts);
  const total=all.length*PLATFORMS.length;
  const done=all.reduce((n,p)=>n+PLATFORMS.filter(pl=>load(platKey(p.ep,pl.id))===true).length,0);
  const pct=Math.round((done/total)*100);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressCount').textContent=`${done} / ${total} posts done`;
}

/* ── FILTER ── */
function filterCards(type,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.post-card').forEach(c=>{
    let show=true;
    if(type==='done') show=c.dataset.done==='true';
    else if(type==='pending') show=c.dataset.done!=='true';
    else if(type!=='all') show=c.dataset.pillar===type;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.week-section').forEach(ws=>{
    ws.style.display=[...ws.querySelectorAll('.post-card')].some(c=>c.style.display!=='none')?'':'none';
  });
}

/* ── SCROLL TOP ── */
window.addEventListener('scroll',()=>{
  document.getElementById('scrollTop').classList.toggle('show',window.scrollY>400);
},{passive:true});

renderAll();
</script>
</body>
</html>
